<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>My Orders - FreshFruit</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-success"
           href="index.html">

            FreshFruit

        </a>

        <div class="d-flex gap-2">

            <a href="favorites.html"
               class="btn btn-outline-danger rounded-pill px-4">

                <i class="bi bi-heart-fill"></i>

                Favorites

            </a>

            <a href="cart.html"
               class="btn btn-success rounded-pill px-4">

                <i class="bi bi-cart3"></i>

                Cart

            </a>

        </div>

    </div>

</nav>


<!-- ================= ORDERS ================= -->

<section class="py-5">

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold mb-1">

                    <i class="bi bi-receipt text-success"></i>

                    My Orders

                </h2>

                <p class="text-muted mb-0">

                    View your previous orders

                </p>

            </div>

            <a href="index.html"
               class="btn btn-outline-success rounded-pill px-4">

                <i class="bi bi-shop"></i>

                Continue Shopping

            </a>

        </div>


        <!-- ORDER LIST -->

        <div id="orders-list">

        </div>

        <!-- ================= ORDER STATUS INFO ================= -->

<div class="order-status-info mt-4">

    <div class="text-center">

        <h5 class="fw-bold mb-3">

            <i class="bi bi-truck text-success"></i>

            Order Status

        </h5>

        <p class="text-muted mb-0">

            Track your order from placement to delivery.

        </p>

    </div>

</div>


        <!-- CLEAR ORDERS -->

        <div class="text-end mt-4">

            <button id="clear-orders-btn"
                    class="btn btn-outline-danger rounded-pill px-4">

                <i class="bi bi-trash"></i>

                Clear Order History

            </button>

        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container text-center">

        <p class="mb-0">

            © 2026 FreshFruit. All Rights Reserved.

        </p>

    </div>

</footer>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Custom JS -->

<script src="js/script.js"></script>

</body>

</html>
