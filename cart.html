<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>FreshFruit - Cart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="index.html">
                FreshFruit
            </a>

            <a href="index.html" class="btn btn-outline-success rounded-pill px-4">
                <i class="bi bi-arrow-left"></i>
                Continue Shopping
            </a>
        </div>
    </nav>

    <!-- ================= CART SECTION ================= -->

    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">

                    <i class="bi bi-cart3 text-success"></i>

                    My Cart

                    <span id="cart-page-count" class="badge bg-success rounded-pill">
                        0
                    </span>

                </h2>

                <a href="index.html" class="btn btn-outline-success rounded-pill px-4">
                    <i class="bi bi-arrow-left"></i>
                    Continue Shopping
                </a>
            </div>


            <div class="d-flex justify-content-between text-muted small mb-2 px-2">

                <span>YOUR PRODUCTS</span>

                <span>ITEM TOTAL</span>

            </div>

            <div id="cart-items">
                <!-- Cart products will appear here -->
            </div>

            <div class="text-end mt-3">

                <button id="clear-cart-btn" class="btn btn-outline-danger rounded-pill px-4">

                    <i class="bi bi-trash"></i>
                    Clear Cart

                </button>

            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
