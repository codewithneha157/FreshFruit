<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Checkout - FreshFruit</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-success"
           href="index.html">

            FreshFruit

        </a>

        <div class="d-flex gap-2">

            <a href="favorites.html"
               class="btn btn-outline-danger rounded-pill px-4">

                <i class="bi bi-heart-fill"></i>

                Favorites

            </a>

            <a href="cart.html"
               class="btn btn-success rounded-pill px-4">

                <i class="bi bi-cart3"></i>

                Cart

            </a>

        </div>

    </div>

</nav>


<!-- ================= CHECKOUT ================= -->

<section class="py-5">

    <div class="container">

        <div class="text-center mb-5">

            <h2 class="fw-bold">

                <i class="bi bi-credit-card text-success"></i>

                Checkout

            </h2>

            <p class="text-muted">

                Complete your details to place your order.

            </p>

        </div>


        <div class="row g-4">

            <!-- ================= CUSTOMER DETAILS ================= -->

            <div class="col-lg-7">

                <div class="card checkout-card border-0">

                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">

                            Delivery Details

                        </h4>


                        <form id="checkout-form">

                            <!-- Name -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <input type="text"
                                       id="customer-name"
                                       class="form-control"
                                       placeholder="Enter your full name"
                                       required>

                            </div>


                            <!-- Mobile -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">

                                    Mobile Number

                                </label>

                                <input type="tel"
                                       id="customer-mobile"
                                       class="form-control"
                                       placeholder="Enter your mobile number"
                                       maxlength="10"
                                       required>

                            </div>


                            <!-- Address -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">

                                    Delivery Address

                                </label>

                                <textarea id="customer-address"
                                          class="form-control"
                                          rows="4"
                                          placeholder="Enter your complete delivery address"
                                          required></textarea>

                            </div>


                            <!-- City -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">

                                    City

                                </label>

                                <input type="text"
                                       id="customer-city"
                                       class="form-control"
                                       placeholder="Enter your city"
                                       required>

                            </div>


                            <!-- Payment -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Payment Method

                                </label>

                                <select id="payment-method"
                                        class="form-select"
                                        required>

                                    <option value="">

                                        Select Payment Method

                                    </option>

                                    <option value="Cash on Delivery">

                                        Cash on Delivery

                                    </option>

                                    <option value="UPI">

                                        UPI

                                    </option>

                                    <option value="Card">

                                        Credit / Debit Card

                                    </option>

                                </select>

                            </div>


                            <button type="submit"
                                    class="btn btn-success w-100 rounded-pill py-2">

                                <i class="bi bi-check-circle"></i>

                                Place Order

                            </button>

                        </form>

                    </div>

                </div>

            </div>


            <!-- ================= ORDER SUMMARY ================= -->

            <div class="col-lg-5">

                <div class="card checkout-card border-0">

                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">

                            Order Summary

                        </h4>


                        <div id="checkout-items">

                        </div>


                        <hr>


                        <div class="d-flex justify-content-between mb-2">

                            <span>

                                Subtotal

                            </span>

                            <strong>

                                ₹<span id="checkout-subtotal">0</span>

                            </strong>

                        </div>


                        <div class="d-flex justify-content-between mb-2">

                            <span>

                                Delivery

                            </span>

                            <strong class="text-success">

                                FREE

                            </strong>

                        </div>


                        <hr>


                        <div class="d-flex justify-content-between">

                            <h5 class="fw-bold">

                                Total

                            </h5>

                            <h5 class="fw-bold text-success">

                                ₹<span id="checkout-total">0</span>

                            </h5>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container text-center">

        <p class="mb-0">

            © 2026 FreshFruit. All Rights Reserved.

        </p>

    </div>

</footer>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Custom JS -->

<script src="js/script.js"></script>

</body>

</html>
