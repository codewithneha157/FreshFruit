<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorites - FreshFruit</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold text-success fs-3"
           href="index.html">

            <i class="bi bi-basket2-fill"></i>
            FreshFruit

        </a>

        <div class="ms-auto">

            <a href="index.html"
               class="btn btn-outline-success rounded-pill px-4 me-2">

                <i class="bi bi-arrow-left"></i>
                Continue Shopping

            </a>

            <a href="cart.html"
               class="btn btn-success rounded-pill px-4">

                <i class="bi bi-cart3"></i>
                Cart

            </a>

        </div>

    </div>

</nav>


<!-- ================= FAVORITES ================= -->

<section class="py-5">

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold mb-0">

                <i class="bi bi-heart-fill text-danger"></i>
                My Favorites

            </h2>

            <button id="clear-favorites"
                    class="btn btn-outline-danger rounded-pill">

                <i class="bi bi-trash"></i>
                Clear All Favorites

            </button>

        </div>


        <!-- Favorites Items -->

        <div id="favorite-items"
             class="row g-4">

        </div>


        <!-- Empty Favorites -->

        <div id="empty-favorites"
             class="text-center py-5"
             style="display: none;">

            <i class="bi bi-heart fs-1 text-muted"></i>

            <h3 class="fw-bold mt-3">
                No Favorite Fruits
            </h3>

            <p class="text-muted">
                You haven't added any fruits to your favorites yet.
            </p>

            <a href="index.html"
               class="btn btn-success rounded-pill px-4">

                <i class="bi bi-basket"></i>
                Browse Fruits

            </a>

        </div>

    </div>

</section>


<!-- Bootstrap JavaScript -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript -->

<script src="js/script.js"></script>

</body>

</html>
